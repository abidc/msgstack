networks:
  mcp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.200.0/24

services:
  msgstack-mcp:
    build: .
    container_name: msgstack-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - mcp_net
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    env_file:
      - .env
    entrypoint: ["python", "run_server.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:///data/msgstack.db
      MSGSTACK_BASE_URL: ${MSGSTACK_BASE_URL:-https://mcp.abidc.dev}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  msgstack-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: msgstack-agent
    restart: unless-stopped
    ports:
      - "8010:8010"
    networks:
      - mcp_net
    volumes:
      - ./agent/data:/app/data
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      AGENT_PORT: "8010"
      # Talk to the MCP server over the compose network, not the public hostname.
      MSGSTACK_MCP_URL: http://msgstack-mcp:8001/mcp
      MSGSTACK_BASE_URL: http://msgstack-mcp:8001
      MSGSTACK_BASIC_USER: ${MSGSTACK_BASIC_USER:-}
      MSGSTACK_BASIC_PASS: ${MSGSTACK_BASIC_PASS:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_APP_PASSWORD: ${TEAMS_APP_PASSWORD:-}
    depends_on:
      - msgstack-mcp
