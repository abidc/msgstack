services:
  msgstack-mcp:
    build: .
    container_name: msgstack-mcp
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/msgstack.db
      MSGSTACK_BASE_URL: ${MSGSTACK_BASE_URL:-https://mcp.abidc.dev}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
