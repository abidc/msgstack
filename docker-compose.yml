networks:
  mcp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.200.0/24

services:
  msgstack-mcp:
    build: .
    container_name: msgstack-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - mcp_net
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/msgstack.db
      MSGSTACK_BASE_URL: ${MSGSTACK_BASE_URL:-https://mcp.abidc.dev}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
