<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MsgStack{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        /* ============================================================
           MsgStack Design System v6 "LEDGER" — light, structured,
           enterprise-credible. Source of truth: msgstack-website
           design-system/tokens.css. Replaces TERMINAL (dark/green) and
           ATLAS. One accent (deep blue) carries every interactive,
           locked and verified state; distinguish by fill, not hue.
           Token NAMES are inherited so existing rules keep working;
           only the values changed. No gradients, glow or glass.
           ============================================================ */
        :root {
            --bg: #FFFFFF;
            --bg-1: #F7F8FA;          /* cards, sidebar */
            --bg-2: #EEF1F5;          /* hover, nested */
            --bg-3: #E3E7ED;
            --border: #E3E7ED;
            --border-light: #CDD3DC;
            --text: #0B0E14;
            --text-2: #3F4757;
            --text-3: #8891A0;
            --primary: #2451E0;       /* the accent */
            --primary-dim: #EEF2FF;
            --primary-hover: #1B3DB8;
            --ember: #2451E0;         /* LOCKED/verified reuse the accent */
            --ember-dim: #EEF2FF;
            --accent-graph: #2451E0;
            --accent-purple: #1B3DB8;
            /* status colours are functional, not brand */
            --success: #15803D;
            --success-dim: rgba(21,128,61,0.10);
            --warn: #B45309;
            --warn-dim: rgba(180,83,9,0.10);
            --warning: #B45309;
            --danger: #DC2626;
            --danger-dim: rgba(220,38,38,0.08);
            --radius: 8px;
            --radius-lg: 12px;
            --font-heading: 'Space Grotesk', -apple-system, sans-serif;
            --font-logo: var(--font-heading);
            --font-display: var(--font-heading);
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', Consolas, monospace;
            --ease-drift: cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
        h1, h2, .page-title, .stat-value { font-family: var(--font-display); font-weight: 600; }
        h3, .card-title { font-family: var(--font-sans); font-weight: 600; }
        .logo { font-family: var(--font-logo); }
        code, pre, .monospace { font-family: var(--font-mono); color: var(--text-2); font-size: 0.92em; }
        .app { display: flex; height: 100vh; overflow: hidden; }

        /* ── Sidebar ── */
        .sidebar { width: 216px; background: var(--bg-1); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; flex-shrink: 0; }
        .logo { font-family: var(--font-heading); font-size: 19px; font-weight: 700; color: var(--text); margin-bottom: 24px; padding: 0 8px; display: flex; align-items: baseline; gap: 3px; letter-spacing: -0.02em; }
        .nav-section { font-family: var(--font-mono); font-size: 9.5px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); padding: 0 8px; margin: 18px 0 6px; }
        .nav-item { padding: 7px 8px; border-radius: var(--radius); cursor: pointer; color: var(--text-2); transition: all 0.12s; margin-bottom: 1px; display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 500; }
        .nav-item:hover { background: var(--bg-2); color: var(--text); }
        .nav-item.active { background: var(--primary-dim); color: var(--primary); }
        .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.8; }
        .nav-item.active svg { opacity: 1; }
        .sidebar-footer { margin-top: auto; padding: 0 8px; font-size: 11px; color: var(--text-3); display: flex; align-items: center; }

        /* ── Main ── */
        .main { flex: 1; overflow-y: auto; background: var(--bg); }
        .page { padding: 28px 32px; width: 100%; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; gap: 16px; }
        .page-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
        .page-subtitle { font-size: 13px; color: var(--text-2); margin-top: 3px; }

        /* ── Buttons ── */
        .btn { padding: 7px 14px; border-radius: var(--radius); font-weight: 600; cursor: pointer; border: 1.5px solid transparent; transition: all 0.16s; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-family: inherit; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: #FFFFFF; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border-light); }
        .btn-ghost:hover { background: transparent; color: var(--primary); border-color: var(--primary); }
        .btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(220,38,38,0.25); }
        .btn-danger:hover { background: rgba(220,38,38,0.14); }
        .btn-success { background: var(--success-dim); color: var(--success); border: 1px solid rgba(21,128,61,0.25); }
        .btn-sm { padding: 4px 9px; font-size: 12px; }
        .btn-xs { padding: 3px 7px; font-size: 11px; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
        .btn svg { width: 13px; height: 13px; }

        /* ── Sections ── */
        .section { display: none; }
        .section.active { display: block; }

        /* ── Cards ── */
        .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
        .card-title { font-weight: 600; font-size: 14px; color: var(--text); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
        .card:last-child { margin-bottom: 0; }

        /* ── Stats ── */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; }
        .stat-value { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); }
        .stat-label { font-size: 12px; color: var(--text-2); margin-top: 3px; }

        /* ── Table ── */
        .table { width: 100%; border-collapse: collapse; }
        .table th { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-3); font-family: var(--font-mono); font-weight: 400; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; }
        .table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .table tr:last-child td { border-bottom: none; }
        .table tbody tr { cursor: pointer; transition: background 0.1s; }
        .table tbody tr:hover td { background: var(--bg-2); }

        /* ── Forms ── */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label { display: block; margin-bottom: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--text-2); font-weight: 400; text-transform: uppercase; letter-spacing: 0.14em; }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 8px 11px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13.5px; font-family: inherit; transition: border-color 0.12s; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); }
        .form-textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
        .form-select { appearance: none; cursor: pointer; }

        /* ── Layout Helpers ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; align-items: stretch; }
        .grid-2 > * { margin: 0; align-self: stretch; }
        .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; color: var(--text-3); text-align: center; }
        .empty svg { margin-bottom: 12px; opacity: 0.5; }
        .empty-title { font-size: 14px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }

        /* ── Artifact Layout ── */
        .artifact-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
        .artifact-sidebar { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; }
        .skill-opt { padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; transition: all 0.12s; margin-bottom: 6px; }
        .skill-opt:hover { border-color: var(--border-light); background: var(--bg-2); }
        .skill-opt.active { border-color: var(--primary); background: var(--primary-dim); }
        .skill-opt-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
        .skill-opt-desc { font-size: 11px; color: var(--text-3); line-height: 1.3; }

        /* ── Toasts ── */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 10px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; color: var(--text); background: var(--bg-1); border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(11,14,20,0.10); transform: translateY(20px); opacity: 0; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-success { border-left: 3px solid var(--success); }
        .toast-error { border-left: 3px solid var(--danger); }

        /* ── Utilities ── */
        .spinner { width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.12); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── LEDGER: flat, structured surfaces — no texture, no glow ── */
        .app { position:relative; z-index:1; }

        /* ── Stamp & badge grammar ── */
        .stamp { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }
        .badge-locked { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--primary); color: #FFFFFF; background: var(--primary); }
        .badge-active { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 1px solid rgba(36,81,224,0.30); color: var(--primary); background: var(--primary-dim); }
        .badge-draft  { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-3); background: var(--bg-2); }

        /* ── Document-type badges (muted, inky — no neon, no purple) ── */
        .doc-type-badge { display: inline-block; font-family: var(--font-mono); font-size: 9px; padding: 2px 8px; border-radius: 6px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 8px; vertical-align: middle; border: 1px solid transparent; }
        .doc-type-canon_domain      { background: var(--primary-dim);       color: var(--primary); border-color: rgba(36,81,224,0.30); }
        .doc-type-brand_guide       { background: var(--bg-2);              color: var(--text-2);  border-color: var(--border); }
        .doc-type-competitive_brief { background: var(--warn-dim);          color: var(--warn);    border-color: rgba(180,83,9,0.30); }
        .doc-type-corp_narrative    { background: var(--success-dim);       color: var(--success); border-color: rgba(21,128,61,0.30); }
        .doc-type-audience_library  { background: var(--bg-2);              color: var(--text-2);  border-color: var(--border); }

        /* ── QoL UX Enhancements ── */

        /* Typography Scaling */
        body {
            font-size: 15px !important;
        }
        .page-title {
            font-size: 24px !important;
            letter-spacing: -0.02em;
        }
        .page-subtitle {
            font-size: 13.5px !important;
        }
        .card-title {
            font-size: 16px !important;
        }
        .stat-value {
            font-size: 36px !important;
            letter-spacing: -0.03em;
        }
        .form-label {
            font-size: 12px !important;
        }
        .form-input, .form-textarea, .form-select {
            font-size: 14px !important;
        }

        /* Tab Transition Animation */
        @keyframes sectionFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section.active {
            display: block !important;
            animation: sectionFadeIn 0.32s var(--ease-drift) forwards;
        }

        /* Premium Card Hover Lift */
        .card {
            transition: border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        .card:hover {
            border-color: var(--border-light);
            box-shadow: 0 4px 14px rgba(11, 14, 20, 0.06);
        }

        /* Sidebar Nav Comfort */
        .nav-item {
            padding: 9px 12px !important;
            font-size: 14px !important;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease !important;
        }

        /* Interactive Lists (interactive items in dashboard lists) */
        .list-item-interactive {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: var(--radius);
            cursor: pointer;
            background: transparent;
            transition: background-color 0.2s ease, transform 0.2s ease !important;
        }
        .list-item-interactive:hover {
            background-color: var(--bg-2);
            transform: translateX(6px);
        }

        /* Global Transition Smoothness */
        .btn, .form-input, .form-textarea, .form-select, .tab-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo" onclick="showSection('dashboard')" style="cursor:pointer;">
                <span>MsgStack</span>
            </div>
            
            <div class="nav-section">Management</div>
            <div class="nav-item active" onclick="showSection('dashboard')">Dashboard</div>
            <div class="nav-item" onclick="showSection('frameworks')">Messaging Houses</div>
            <div class="nav-item" onclick="showSection('upload')">Upload</div>
            
            <div class="nav-section">Execution</div>
            <div class="nav-item" onclick="showSection('artifacts')">Artifacts</div>
            <div class="nav-item" onclick="showSection('scoring')">Alignment Scoring</div>
            <div class="nav-item" onclick="showSection('governance')">Governance</div>
            <div class="nav-item" onclick="showSection('skills')">Skills</div>
            <div class="nav-item" onclick="showSection('channels')">Channels</div>
            
            <div class="nav-section">Sources</div>
            <div class="nav-item" onclick="showSection('connections')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                Connections
            </div>

            <div class="nav-section">System</div>
            <div class="nav-item" onclick="showSection('api-keys')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                API Keys
            </div>
            <div class="nav-item" onclick="showSection('graph')">Graph Explorer</div>
            <div class="nav-item" onclick="showSection('settings')">Settings</div>
            
            <div class="sidebar-footer">
                <span class="stamp" style="font-size:9px;">v0.9</span>
            </div>
        </aside>
        
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
