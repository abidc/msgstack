<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/canvas/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artifact Editor - MsgStack</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;700;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', sans-serif; background: #0f1117; color: #e1e4e8; height: 100vh; overflow: hidden; }
      #app { display: flex; height: 100vh; }
      #sidebar { width: 280px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
      #sidebar-header { padding: 16px; border-bottom: 1px solid #30363d; }
      #sidebar-header h2 { font-size: 14px; font-weight: 600; color: #e1e4e8; }
      #toolbar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
      .btn { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
      .btn:hover { background: #2ea043; }
      .btn-secondary { background: #30363d; color: #e1e4e8; }
      .btn-secondary:hover { background: #3d444d; }
      .btn-danger { background: #da3633; }
      .btn-danger:hover { background: #f85149; }
      #canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #0f1117; overflow: auto; }
      #fabric-canvas { box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
      #zone-list { flex: 1; overflow-y: auto; padding: 8px; }
      .zone-item { padding: 8px 12px; margin: 4px 0; background: #21262d; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
      .zone-item:hover { border-color: #58a6ff; }
      .zone-item.active { border-color: #58a6ff; background: #1c2a3a; }
      .zone-type { color: #58a6ff; font-weight: 600; }
      .zone-name { color: #8b949e; margin-left: 6px; }
      #edit-panel { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: #161b22; border-left: 1px solid #30363d; transition: right 0.3s; z-index: 100; padding: 20px; overflow-y: auto; }
      #edit-panel.open { right: 0; }
      #edit-panel h3 { margin-bottom: 16px; font-size: 16px; }
      .form-group { margin-bottom: 12px; }
      .form-group label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
      .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; background: #0f1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8; font-size: 13px; }
      .form-group textarea { min-height: 80px; resize: vertical; }
      .color-input { display: flex; gap: 8px; align-items: center; }
      .color-input input[type="color"] { width: 40px; height: 32px; padding: 2px; cursor: pointer; }
      #toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: #238636; color: white; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; z-index: 200; }
      #toast.show { opacity: 1; }
      #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 999; }
      .spinner { border: 3px solid #30363d; border-top: 3px solid #58a6ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading"><div class="spinner"></div></div>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-header">
          <h2>🎨 Artifact Editor</h2>
          <p style="font-size:11px;color:#8b949e;margin-top:4px" id="artifact-info"></p>
        </div>
        <div id="toolbar">
          <button class="btn" onclick="exportPNG()">PNG</button>
          <button class="btn" onclick="exportPDF()">PDF</button>
          <button class="btn" onclick="exportSVG()">SVG</button>
          <button class="btn btn-secondary" onclick="exportPrint()">Print 300dpi</button>
          <button class="btn btn-secondary" onclick="resetToAI()">Reset to AI</button>
        </div>
        <div id="zone-list"></div>
      </div>
      <div id="canvas-container">
        <canvas id="fabric-canvas" width="850" height="1100"></canvas>
      </div>
    </div>
    <div id="edit-panel">
      <h3>Edit Zone</h3>
      <div id="edit-form"></div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn" onclick="saveZoneEdit()">Save</button>
        <button class="btn btn-secondary" onclick="closeEditPanel()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteZone()" style="margin-left:auto">Delete</button>
      </div>
    </div>
    <div id="toast"></div>
    <script src="/canvas/assets/canvas-app.js"></script>
  </body>
</html>
